name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Common and Security Libraries
        run: mvn clean install -pl common-lib,security-lib -am -Dmaven.test.skip=true

      - name: Build Microservices (Continuous Integration)
        run: mvn clean package -Dmaven.test.skip=true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        run: |
          # Create a unique, auto-incrementing version tag (e.g., v1, v2, v3)
          VERSION="v${{ github.run_number }}"
          
          echo "Building and pushing version: $VERSION"

          # 1. Config Server
          docker build -t farazpr0/olp-config-server:latest -t farazpr0/olp-config-server:$VERSION ./config-server
          docker push farazpr0/olp-config-server:latest
          docker push farazpr0/olp-config-server:$VERSION
          
          # 2. Service Discovery
          docker build -t farazpr0/olp-service-discovery:latest -t farazpr0/olp-service-discovery:$VERSION ./service-discovery
          docker push farazpr0/olp-service-discovery:latest
          docker push farazpr0/olp-service-discovery:$VERSION
          
          # 3. API Gateway
          docker build -t farazpr0/olp-api-gateway:latest -t farazpr0/olp-api-gateway:$VERSION ./api-gateway
          docker push farazpr0/olp-api-gateway:latest
          docker push farazpr0/olp-api-gateway:$VERSION
          
          # 4. User Service
          docker build -t farazpr0/olp-user-service:latest -t farazpr0/olp-user-service:$VERSION ./user-service
          docker push farazpr0/olp-user-service:latest
          docker push farazpr0/olp-user-service:$VERSION
          
          # 5. Course Service
          docker build -t farazpr0/olp-course-service:latest -t farazpr0/olp-course-service:$VERSION ./course-service
          docker push farazpr0/olp-course-service:latest
          docker push farazpr0/olp-course-service:$VERSION
          
          # 6. Enrollment Service
          docker build -t farazpr0/olp-enrollment-service:latest -t farazpr0/olp-enrollment-service:$VERSION ./enrollment-service
          docker push farazpr0/olp-enrollment-service:latest
          docker push farazpr0/olp-enrollment-service:$VERSION
          
          # 7. Notification Service
          docker build -t farazpr0/olp-notification-service:latest -t farazpr0/olp-notification-service:$VERSION ./notification-service
          docker push farazpr0/olp-notification-service:latest
          docker push farazpr0/olp-notification-service:$VERSION