server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # User Service
        - id: user-service
          uri: lb://user-service # 'lb://' tells it to use the Eureka Load Balancer to find 'user-service'
          predicates:
            - Path=/api/auth/**, /api/users/**

        # Course Service
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true