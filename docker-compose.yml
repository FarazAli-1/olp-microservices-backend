version: '3.8'

services:
  # -------------------------
  # SERVICE DISCOVERY (EUREKA)
  # -------------------------
  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - olp-network

  # -------------------------
  # USER SERVICE & DATABASE
  # -------------------------
  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olp_user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - olp-network
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://user-db:5432/olp_user_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyThatIsAtLeast32CharactersLongForHS256}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      - user-db
      - service-discovery
    networks:
      - olp-network
    restart: unless-stopped

  # -------------------------
  # COURSE SERVICE & DATABASE
  # -------------------------
  course-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olp_course_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - course_db_data:/var/lib/postgresql/data
    networks:
      - olp-network
    restart: unless-stopped

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://course-db:5432/olp_course_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyThatIsAtLeast32CharactersLongForHS256}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      - course-db
      - service-discovery
    networks:
      - olp-network
    restart: unless-stopped

  # -------------------------
  # ENROLLMENT SERVICE & DATABASE
  # -------------------------
  enrollment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olp_enrollment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - enrollment_db_data:/var/lib/postgresql/data
    networks:
      - olp-network
    restart: unless-stopped

  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://enrollment-db:5432/olp_enrollment_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyThatIsAtLeast32CharactersLongForHS256}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      - enrollment-db
      - service-discovery
    networks:
      - olp-network
    restart: unless-stopped

  # -----------------------------------------------
  # Notification Service
  # -----------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    depends_on:
      - service-discovery
      - redis
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - olp-network
    restart: unless-stopped

  # -----------------------------------------------
  # Redis Message Broker
  # -----------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: redis-broker
    ports:
      - "6379:6379"
    networks:
      - olp-network
    restart: unless-stopped

  # -------------------------
  # API GATEWAY
  # -------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      - service-discovery
    networks:
      - olp-network

# Declare the custom network
networks:
  olp-network:
    driver: bridge

volumes:
  user_db_data:
  course_db_data:
  enrollment_db_data: