version: '3.8'

services:
  # -------------------------
  # SERVICE DISCOVERY (EUREKA)
  # -------------------------
  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - olp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------
  # CONFIG SERVER
  # -------------------------
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - olp-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------
  # REDIS MESSAGE BROKER / CACHE
  # -------------------------
  redis:
    image: redis:7.0-alpine
    container_name: redis-broker
    ports:
      - "6379:6379"
    networks:
      - olp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------
  # USER SERVICE & DATABASE
  # -------------------------
  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olp_user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - olp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olp_user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://user-db:5432/olp_user_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyThatIsAtLeast32CharactersLongForHS256}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      user-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olp-network
    restart: unless-stopped

  # -------------------------
  # COURSE SERVICE & DATABASE
  # -------------------------
  course-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olp_course_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - course_db_data:/var/lib/postgresql/data
    networks:
      - olp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olp_course_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://course-db:5432/olp_course_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyThatIsAtLeast32CharactersLongForHS256}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      course-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olp-network
    restart: unless-stopped

  # -------------------------
  # ENROLLMENT SERVICE & DATABASE
  # -------------------------
  enrollment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olp_enrollment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - enrollment_db_data:/var/lib/postgresql/data
    networks:
      - olp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olp_enrollment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://enrollment-db:5432/olp_enrollment_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyThatIsAtLeast32CharactersLongForHS256}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      enrollment-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olp-network
    restart: unless-stopped

  # -----------------------------------------------
  # NOTIFICATION SERVICE
  # -----------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    depends_on:
      service-discovery:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - olp-network
    restart: unless-stopped

  # -------------------------
  # API GATEWAY
  # -------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - olp-network

# Declare the custom network
networks:
  olp-network:
    driver: bridge

volumes:
  user_db_data:
  course_db_data:
  enrollment_db_data: